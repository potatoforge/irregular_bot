name: Lint + Tests

on:
    push:
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14"
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install ruff
            - name: Run Ruff
              run: ruff check --output-format=github .
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run tests
              run: make run-tests-ci
